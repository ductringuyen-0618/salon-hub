spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/salon_hub
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    clean-disabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration  # PostgreSQL migrations
  # OAuth2 resource server (Supabase JWT verification).
  # When SUPABASE_JWKS_URL is set, Spring auto-configures a JwtDecoder that
  # fetches the JWKS from Supabase and verifies ES256 signatures. The
  # SupabaseJwtAuthenticationFilter then maps the verified JWT to a local User.
  #
  # jwk-set-uri / issuer-uri are deliberately left out when unset rather
  # than given a `${VAR:#{null}}` default — see the `supabase:` block below
  # for why that idiom doesn't skip auto-config here: with it, resource
  # server auto-config still sees the property as present (resolved to the
  # literal string "#{null}") and tries to build a NimbusJwtDecoder from it,
  # failing with MalformedURLException. Leaving the keys out lets relaxed
  # env-var binding supply them only when SUPABASE_JWKS_URL/SUPABASE_ISSUER
  # are actually set.
  security:
    oauth2:
      resourceserver:
        jwt:
          # Supabase signs with ES256 (asymmetric ECDSA P-256).
          # Spring's default only accepts RS256 unless we list ES256 here.
          jws-algorithms: ES256
server:
    port: ${PORT:8082}
springdoc:
  packages-to-scan:
    - com.salonhub.api

# JWT Configuration
# In dev a hardcoded fallback is acceptable; in prod JWT_SECRET MUST be set via env.
# The previous committed secret was leaked publicly and has been rotated.
jwt:
  # The previous committed secret 404E63...66B5970 was leaked publicly and has been rotated.
  # In prod set JWT_SECRET in the host env (Render/Fly dashboard). Dev fallback is hex
  # because jjwt 0.11.x base64-decodes the secret string.
  secret: ${JWT_SECRET:1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b}
  expiration: 86400000 # 24 hours in milliseconds

# CORS allowed origins (comma-separated). Empty/unset = permissive (dev only).
salon-hub:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# Supabase Auth config (consumed by SupabaseProperties).
# The SupabaseJwtAuthenticationFilter only activates when jwks-url is set.
#
# jwks-url and secret-key are deliberately NOT given a `${VAR:#{null}}`
# default here: that default-value syntax is only SpEL-evaluated inside
# @Value, not for plain property lookups. @ConditionalOnProperty (which
# gates SupabaseJwtAuthenticationFilter and SupabaseAdminClient below)
# reads the property directly, so a `#{null}` default would resolve to
# the literal string "#{null}" — present and non-"false" — and the
# conditional would always match even with no env var set. Leaving the
# keys out entirely when unset lets Spring's relaxed env-var binding
# populate them only when SUPABASE_JWKS_URL / SUPABASE_SECRET_KEY are
# actually set, which is what @ConditionalOnProperty needs to see them
# as genuinely absent.
supabase:
  url: ${SUPABASE_URL:#{null}}
  issuer: ${SUPABASE_ISSUER:#{null}}
