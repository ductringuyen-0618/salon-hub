spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/salon_hub
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    clean-disabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration  # PostgreSQL migrations
server:
    port: ${PORT:8082}
springdoc:
  packages-to-scan:
    - com.salonhub.api

# JWT Configuration
# In dev a hardcoded fallback is acceptable; in prod JWT_SECRET MUST be set via env.
# The previous committed secret was leaked publicly and has been rotated.
jwt:
  secret: ${JWT_SECRET:dev-only-secret-replace-in-prod-via-env-do-not-commit-real-secrets}
  expiration: 86400000 # 24 hours in milliseconds

# CORS allowed origins (comma-separated). Empty/unset = permissive (dev only).
salon-hub:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
