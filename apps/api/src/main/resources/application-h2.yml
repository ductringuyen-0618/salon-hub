spring:
  datasource:
    url: jdbc:h2:mem:salon_hub_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop  # Hibernate manages schema; Flyway disabled below
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  flyway:
    enabled: false  # H2 uses Hibernate DDL; seed data via TestDataInitializer instead
server:
  port: ${PORT:8082}
springdoc:
  packages-to-scan:
    - com.salonhub.api
jwt:
  # 64 hex chars = 256 bits. Hex is base64-safe (jjwt 0.11.x base64-decodes the secret).
  # Dev-only — do not use in prod.
  secret: 1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b
  expiration: 86400000
salon-hub:
  cors:
    allowed-origins:
