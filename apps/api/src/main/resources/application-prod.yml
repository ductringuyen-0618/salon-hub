# Production profile.
# Activate with -Dspring.profiles.active=prod (the Dockerfile already does this).
# All sensitive values come from environment variables — never committed.
spring:
  datasource:
    # DATABASE_URL is provided by Render's managed Postgres (fromDatabase).
    # Falls back to localhost so this profile can be smoke-tested locally too.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/salon_hub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    clean-disabled: true            # NEVER allow flyway clean in prod
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}                 # Render injects PORT

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    enabled: false                   # disable swagger UI in prod
  api-docs:
    enabled: false

# JWT — MUST be set in env (Render: dashboard env var, sync:false)
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# CORS — set CORS_ALLOWED_ORIGINS to a comma-separated list of frontend origins
salon-hub:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    root: INFO
    com.salonhub.api: INFO
    org.springframework.web: INFO
