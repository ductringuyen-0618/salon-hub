# fly.toml -- salon-hub backend (Spring Boot)
#
# To launch (one-time):
#   cd apps/api
#   flyctl auth login
#   flyctl launch --copy-config --no-deploy
#   flyctl postgres create --name salon-hub-pg --region iad
#   flyctl postgres attach salon-hub-pg          # sets DATABASE_URL secret
#   flyctl secrets set JWT_SECRET=<random-hex-64> \
#                      CORS_ALLOWED_ORIGINS=https://salon-hub.vercel.app \
#                      SPRING_PROFILES_ACTIVE=prod
#   flyctl deploy
#
# Redeploy after code changes:  flyctl deploy
# Tail logs:                    flyctl logs
# Open a shell:                 flyctl ssh console

app = "salon-hub-api"
primary_region = "iad"

[build]
  # Builds from apps/api/Dockerfile (this directory)

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  # PORT is injected by Fly and read by application-prod.yml's
  # `server.port: ${PORT:8080}`.
  # JAVA_TOOL_OPTIONS keeps the JVM honest about container memory.
  JAVA_TOOL_OPTIONS = "-XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC -Xss512k"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # Spring Boot cold start is ~25s — keep one warm
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 50

[[http_service.checks]]
  # Spring's actuator/health endpoint. Generous grace period to ride out
  # cold-start; Hibernate + Flyway can take ~20s on the first boot.
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"
  method = "GET"
  path = "/actuator/health"

[[vm]]
  # 2GB for Spring Boot + JVM overhead. shared-cpu-2x stays cheap;
  # the JVM is happier with 2 vCPUs for GC + request handling.
  size = "shared-cpu-2x"
  memory = "2gb"
  cpus = 2
