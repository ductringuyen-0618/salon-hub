name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Lint web
        run: npm run lint --workspace apps/web
      - name: Test web
        run: npm run test --workspace apps/web
      - name: Build web
        run: npm run build --workspace apps/web

  function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Typecheck function
        run: npm run lint --workspace apps/salon-function
      - name: Test function
        run: npm run test --workspace apps/salon-function
      - name: Build function
        run: npm run build --workspace apps/salon-function
